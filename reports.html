<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biano's Pizza — Reports</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-shell-nav"></div>
    <div class="main">
      <div class="content">
        <div class="toolbar">
          <h2 class="page-title" style="margin-bottom:0;">Reports</h2>
          <button class="btn-small" onclick="window.print()">Print report</button>
        </div>

        <div class="stat-grid">
          <div class="stat-card"><div class="label">Inventory value</div><div class="value" id="rInvValue">-</div></div>
          <div class="stat-card"><div class="label">Total sales</div><div class="value" id="rSales">-</div></div>
          <div class="stat-card"><div class="label">Stock in</div><div class="value" id="rStockIn">-</div></div>
          <div class="stat-card"><div class="label">Orders</div><div class="value" id="rOrders">-</div></div>
        </div>

        <h2 class="page-title" style="font-size:14px;">Low / Out of Stock Ingredients</h2>
        <div class="table-wrap" style="margin-bottom:26px;">
          <table>
            <thead><tr><th>Ingredient</th><th>Stock</th><th>Reorder Level</th><th>Status</th></tr></thead>
            <tbody id="lowStockBody"></tbody>
          </table>
        </div>

        <h2 class="page-title" style="font-size:14px;">Recent Activity</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>User</th><th>Action</th><th>Description</th></tr></thead>
            <tbody id="activityBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
