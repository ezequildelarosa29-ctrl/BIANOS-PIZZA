<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biano's Pizza — Menu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-shell-nav"></div>
    <div class="main">
      <div class="content">
        <h2 class="page-title">Menu</h2>

        <div class="toolbar">
          <input type="text" id="searchBox" placeholder="Search menu item...">
          <button class="btn-small" id="addItemBtn">+ Add menu item</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Size</th><th>Price</th><th>Status</th></tr></thead>
            <tbody id="menuBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <h3>Add menu item</h3>
      <form id="itemForm">
        <div class="field"><label>Name</label><input type="text" id="mName" required placeholder="e.g. Pepperoni Feast"></div>
        <div class="field">
          <label>Category</label>
          <select id="mCategory">
            <option>Classic</option>
            <option>Specialty</option>
            <option>Sides</option>
            <option>Drinks</option>
          </select>
        </div>
        <div class="field">
          <label>Size</label>
          <select id="mSize">
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
            <option>N/A</option>
          </select>
        </div>
        <div class="field"><label>Price</label><input type="number" id="mPrice" step="0.01" required></div>
        <div class="field"><label>Cost</label><input type="number" id="mCost" step="0.01" required></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" id="cancelItemBtn">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
