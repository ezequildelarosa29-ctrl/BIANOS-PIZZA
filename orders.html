<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biano's Pizza — Orders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-shell-nav"></div>
    <div class="main">
      <div class="content" style="max-width:560px;">
        <h2 class="page-title">Place order</h2>
        <div id="msgBox"></div>
        <form id="orderForm">
          <div class="field">
            <label>Menu Item</label>
            <select id="oMenuItem" required></select>
          </div>
          <div class="field"><label>Quantity</label><input type="number" id="oQty" value="1" required></div>
          <div class="field"><label>Selling Price (per unit)</label><input type="number" step="0.01" id="oPrice" required></div>
          <div class="field">
            <label>Order Type</label>
            <select id="oType">
              <option>Dine-in</option>
              <option>Takeout</option>
              <option>Delivery</option>
            </select>
          </div>
          <div class="field"><label>Customer Name</label><input type="text" id="oCustomer"></div>
          <div class="field"><label>Reference Number</label><input type="text" id="oRef"></div>
          <button type="submit" class="btn">Save order</button>
        </form>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="orders.js"></script>
</body>
</html>
