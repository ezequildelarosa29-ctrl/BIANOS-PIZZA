<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biano's Pizza — Stock In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-shell-nav"></div>
    <div class="main">
      <div class="content" style="max-width:560px;">
        <h2 class="page-title">Stock in (ingredients)</h2>
        <div id="msgBox"></div>

        <div class="toolbar" style="margin-bottom:24px;">
          <span style="font-size:12.5px;color:var(--ink-soft);">New ingredient not listed below?</span>
          <button class="btn-small" id="addIngredientBtn" type="button">+ Add ingredient</button>
        </div>

        <form id="stockInForm">
          <div class="field">
            <label>Ingredient</label>
            <select id="siIngredient" required></select>
          </div>
          <div class="field">
            <label>Supplier</label>
            <select id="siSupplier" required></select>
          </div>
          <div class="field"><label>Quantity</label><input type="number" id="siQty" required></div>
          <div class="field"><label>Cost Price</label><input type="number" step="0.01" id="siCost" required></div>
          <div class="field"><label>Reference Number</label><input type="text" id="siRef"></div>
          <button type="submit" class="btn">Save stock in</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="ingredientModal">
    <div class="modal">
      <h3>Add ingredient</h3>
      <form id="ingredientForm">
        <div class="field"><label>Name</label><input type="text" id="iName" required placeholder="e.g. Mozzarella Cheese"></div>
        <div class="field"><label>Unit</label><input type="text" id="iUnit" placeholder="kg / pcs / liters" required></div>
        <div class="field"><label>Starting Stock</label><input type="number" id="iStock" value="0" required></div>
        <div class="field"><label>Cost per Unit</label><input type="number" step="0.01" id="iCost" value="0" required></div>
        <div class="field"><label>Reorder Level</label><input type="number" id="iReorder" value="5" required></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" id="cancelIngredientBtn">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/stockin.js"></script>
</body>
</html>
