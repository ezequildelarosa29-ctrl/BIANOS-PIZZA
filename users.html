<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biano's Pizza — User Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-shell-nav"></div>
    <div class="main">
      <div class="content">
        <div class="toolbar">
          <div>
            <h2 class="page-title" style="margin-bottom:2px;">User management</h2>
            <p style="font-size:10px;color:var(--ink-faint);">Visible to Administrator only</p>
          </div>
          <button class="btn-small" id="addUserBtn">+ Add user</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Status</th></tr></thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="userModal">
    <div class="modal">
      <h3>Add user</h3>
      <form id="userForm">
        <div class="field"><label>Username</label><input type="text" id="uUsername" required></div>
        <div class="field"><label>Temporary Password</label><input type="text" id="uPassword" required></div>
        <div class="field"><label>Email (for OTP codes)</label><input type="email" id="uEmail" required></div>
        <div class="field">
          <label>Role</label>
          <select id="uRole"><option value="staff">staff</option><option value="admin">admin</option></select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" id="cancelUserBtn">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
